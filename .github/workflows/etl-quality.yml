name: ETL quality

on:
  pull_request:
    paths:
      - "etl/**"
      - "sakunagraph_etl/**"
      - "ETL_PLAN.md"
      - ".github/workflows/etl-quality.yml"
  push:
    paths:
      - "etl/**"
      - "sakunagraph_etl/**"
      - "ETL_PLAN.md"
      - ".github/workflows/etl-quality.yml"

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sakunagraph_etl

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            sakunagraph_etl/requirements-core.txt
            sakunagraph_etl/constraints.txt
            sakunagraph_etl/pyproject.toml
      - name: Install focused test dependencies
        run: python -m pip install -c constraints.txt attrs fastexcel lxml openpyxl pandas polars pyshacl python-dateutil rdflib requests thefuzz
      - name: Validate package metadata
        run: python -m pip install --no-deps --editable .
      - name: Build installable wheel
        run: python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/etl-wheel" .
      - name: Compile production modules
        run: python -m compileall -q src/sakunagraph_etl
      - name: Compile preserved compatibility modules
        run: python -m compileall -q ../etl/etl_config.py ../etl/fetch ../etl/mappings ../etl/parse ../etl/pipeline ../etl/semantic_processing ../etl/transform ../etl/validate
      - name: Run focused tests
        run: python -m unittest discover -s tests -t . -v
