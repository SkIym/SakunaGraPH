name: ETL security and infrastructure

on:
  pull_request:
    paths:
      - "etl/**"
      - "sakunagraph_etl/**"
      - ".github/dependabot.yml"
      - ".github/workflows/etl-security.yml"
  push:
    paths:
      - "etl/**"
      - "sakunagraph_etl/**"
      - ".github/dependabot.yml"
      - ".github/workflows/etl-security.yml"
  schedule:
    - cron: "0 20 * * 0"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sakunagraph_etl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit every ETL dependency layer
        run: >-
          python -m pip_audit
          --requirement requirements-core.txt
          --requirement requirements-cloud.txt
          --requirement requirements-document.txt
          --format cyclonedx-json
          --output dependency-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: etl-dependency-sbom
          path: sakunagraph_etl/dependency-sbom.json

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sakunagraph_etl/deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  image-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sakunagraph_etl
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build core
      - run: docker run --rm --entrypoint python sakunagraph-etl-core:0.9.0 -m pip check
