name: Frontend quality

on:
  pull_request:
    paths:
      - "frontend/**"
      - "api/src/**"
      - "api/tests/**"
      - "api/Dockerfile"
      - "api/.dockerignore"
      - "deploy/**"
      - "docker-compose.yml"
      - ".env.compose.example"
      - "FRONTEND_PLAN.md"
      - ".github/workflows/frontend-quality.yml"
  push:
    paths:
      - "frontend/**"
      - "api/src/**"
      - "api/tests/**"
      - "api/Dockerfile"
      - "api/.dockerignore"
      - "deploy/**"
      - "docker-compose.yml"
      - ".env.compose.example"
      - "FRONTEND_PLAN.md"
      - ".github/workflows/frontend-quality.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:e2e:stream
      - run: npm run test:a11y
      - run: npm run build
      - run: npm run test:performance
      - run: npm run test:deployment

  api-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install -r ../api/requirements.txt
      - run: python scripts/check_api_contract.py
      - name: Keep the existing API suite green
        working-directory: api
        run: python -m unittest discover -s tests -v
