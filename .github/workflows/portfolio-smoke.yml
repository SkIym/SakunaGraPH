name: Portfolio smoke

on:
  pull_request:
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "DATA_SOURCES.md"
      - "scripts/portfolio_demo.py"
      - "ontology/**"
      - "sakunagraph_etl/tests/baselines.json"
      - "sakunagraph_etl/tests/golden/**"
      - ".github/workflows/portfolio-smoke.yml"
  push:
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "DATA_SOURCES.md"
      - "scripts/portfolio_demo.py"
      - "ontology/**"
      - "sakunagraph_etl/tests/baselines.json"
      - "sakunagraph_etl/tests/golden/**"
      - ".github/workflows/portfolio-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install rdflib==7.6.0
      - run: python -m py_compile scripts/portfolio_demo.py
      - run: python scripts/portfolio_demo.py
