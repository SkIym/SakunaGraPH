services:
  api:
    environment:
      GRAPHDB_ENDPOINT: http://deployment-upstream:9090/graphdb
      AWS_REGION: ap-southeast-1
      AWS_ACCESS_KEY_ID: deployment-test-key
      AWS_SECRET_ACCESS_KEY: deployment-test-secret
      BEDROCK_MODEL_ID: deployment-test-model
      BEDROCK_ENDPOINT_URL: http://deployment-upstream:9090
      BEDROCK_READ_TIMEOUT: 10
      BEDROCK_STREAMING: 'false'
    depends_on:
      deployment-upstream:
        condition: service_healthy

  deployment-upstream:
    image: node:22-bookworm-slim
    working_dir: /fixture
    command: ['node', 'upstream-server.js']
    volumes:
      - ./frontend/tests/deployment:/fixture:ro
    expose:
      - '9090'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9090/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      start_period: 2s
      retries: 10
